name: release

# Ten workflow uruchamia się automatycznie, gdy na GitHubie
# opublikujesz nowy "Release" (z tagiem, np. v0.1.0).
# Buduje wtedy aplikację na Ubuntu, Windows i macOS i dołącza pliki
# instalacyjne (.deb, .AppImage, NSIS .exe oraz uniwersalny .dmg)
# do tego release'a, żeby każdy mógł je pobrać.
on:
  release:
    types: [published]
  workflow_dispatch: # pozwala też uruchomić ręcznie z zakładki Actions

# Domyślny token GitHub Actions nie ma prawa modyfikować release'ów.
# Ta linijka nadaje mu uprawnienie zapisu, żeby móc wrzucić pliki (.deb/.AppImage).
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zainstaluj zależności systemowe (Tauri / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Zainstaluj zależności frontendu (npm ci)
        run: npm ci

      - name: Zbuduj aplikację i dołącz pliki do release'a
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Issue #66: klucz podpisujący aktualizacje (HITL — Adam generuje
          # `tauri signer generate` i wpisuje sekrety). Bez tych sekretów
          # build się nie powiedzie, bo tauri.conf.json włącza
          # createUpdaterArtifacts — bundle aktualizacji MUSI być podpisany.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseName: ${{ github.event.release.name }}
          releaseDraft: false
          prerelease: false
          # Issue #66: dołącz latest.json (manifest aktualizacji); tauri-action
          # scala platformy, gdy kolejne joby publikują swoje wpisy.
          includeUpdaterJson: true
          # budujemy tylko pakiet Linux (deb + AppImage + rpm)
          args: --target x86_64-unknown-linux-gnu

      # Landing page (umux.pages.dev) linkuje pliki przez wzorzec GitHuba
      # `releases/latest/download/<nazwa>` — zawsze najnowszy release, ale
      # nazwa pliku musi pasować DOKŁADNIE, a nazwy z CI zawierają numer
      # wersji. Dlatego obok plików z wersją wrzucamy trwałe aliasy bez
      # numeru — strona linkuje do nich i nigdy nie wymaga ręcznej poprawki
      # po nowym release. --clobber podmienia aliasy w kolejnym release.
      - name: Dodaj aliasy bez numeru wersji (dla landing page)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Ręczny przebieg (workflow_dispatch) bez release'u — pomijam aliasy."
            exit 0
          fi
          BUNDLE=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          cp "$BUNDLE"/appimage/umux_*_amd64.AppImage umux_amd64.AppImage
          cp "$BUNDLE"/deb/umux_*_amd64.deb           umux_amd64.deb
          cp "$BUNDLE"/rpm/umux-*.x86_64.rpm          umux_x86_64.rpm
          gh release upload "$TAG" --clobber \
            umux_amd64.AppImage umux_amd64.deb umux_x86_64.rpm \
            --repo "$GITHUB_REPOSITORY"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build uniwersalny łączy dwie architektury w jeden plik .dmg:
      # aarch64 (Apple Silicon M1+) + x86_64 (starsze Intele).
      # Na macOS nie instalujemy zależności systemowych — WebKit
      # (wkwebView) jest częścią systemu.
      - name: Dodaj cele Rust (build uniwersalny)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Zainstaluj zależności frontendu (npm ci)
        run: npm ci

      - name: Zbuduj aplikację i dołącz pliki do release'a (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Issue #66: podpisywanie bundle'a aktualizacji (.app.tar.gz) —
          # jsame sekrety co na Linux/Windows (HITL: Adam generuje klucz).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseName: ${{ github.event.release.name }}
          releaseDraft: false
          prerelease: false
          # Issue #66: latest.json w release — wpis darwin (uniwersalny)
          includeUpdaterJson: true
          # .app + .dmg uniwersalny (Apple Silicon i Intel w jednym)
          args: --target universal-apple-darwin

      # Alias bez numeru wersji dla landing page (patrz komentarz w jobie
      # build-linux) — stała nazwa .dmg, która zawsze wskazuje najnowszy release.
      - name: Dodaj alias bez numeru wersji (dla landing page)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Ręczny przebieg (workflow_dispatch) bez release'u — pomijam alias."
            exit 0
          fi
          DMG=src-tauri/target/universal-apple-darwin/release/bundle/dmg
          cp "$DMG"/umux_*_universal.dmg umux_universal.dmg
          gh release upload "$TAG" --clobber umux_universal.dmg \
            --repo "$GITHUB_REPOSITORY"

  # v1.0 Phase 10 / #34: trzecia platforma w macierzy release'u.
  # Windows buduje przez ConPTY-ready backend (v1.0 Phase 9 / #33);
  # runner windows-latest ma MSVC, Rust i WebView2 out-of-the-box.
  # Budujemy JEDEN deterministyczny artefakt: instalator NSIS
  # (umux_<wersja>_x64-setup.exe) — .msi celowo pomijamy, żeby zestaw
  # plików w release'e był przewidywalny (README obiecuje .exe).
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zainstaluj zależności frontendu (npm ci)
        run: npm ci

      - name: Zbuduj aplikację i dołącz pliki do release'a (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Issue #66: podpisywanie bundle'a aktualizacji (NSIS) — te same
          # sekrety co na Linux/macOS (HITL: Adam generuje klucz).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseName: ${{ github.event.release.name }}
          releaseDraft: false
          prerelease: false
          # Issue #66: latest.json w release — wpis windows-x86_64
          includeUpdaterJson: true
          # Aktualizacje Windows biorą instalator NSIS (nie .msi) jako bundle
          updaterJsonPreferNsis: true
          # Instalator NSIS: umux_<wersja>_x64-setup.exe
          args: --bundles nsis

      # Alias bez numeru wersji dla landing page (patrz komentarz w jobie
      # build-linux) — stała nazwa .exe, która zawsze wskazuje najnowszy release.
      - name: Dodaj alias bez numeru wersji (dla landing page)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          if (-not $env:TAG) {
            Write-Host "Ręczny przebieg (workflow_dispatch) bez release'u — pomijam alias."
            exit 0
          }
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/umux_*_x64-setup.exe" |
            Select-Object -First 1
          if (-not $exe) { throw "Nie znaleziono instalatora NSIS w bundle/nsis/" }
          Copy-Item $exe.FullName umux_x64-setup.exe
          gh release upload $env:TAG --clobber umux_x64-setup.exe `
            --repo $env:GITHUB_REPOSITORY
