name: Core backend tests

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/core.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux D-Bus dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus
      - name: Build daemon and CLI
        working-directory: src-tauri
        run: cargo build --locked -p umux-storestation -p umux
      - name: Test daemon, CLI and shared engines (Unix)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        # PTY tests compete for the host's terminal limit when run in parallel.
        run: cargo test --locked -p umux-storestation -p umux -p store_core -p session_core -- --test-threads=1
      - name: Test Windows Core backend
        if: runner.os == 'Windows'
        working-directory: src-tauri
        # The shared PTY suites use /bin/sh; Core itself is platform-native.
        run: |
          cargo test --locked -p umux-storestation --lib core::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p umux --test core_lifecycle
