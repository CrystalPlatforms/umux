name: Core backend tests

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/core.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux D-Bus dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus
      - name: Build daemon and CLI
        working-directory: src-tauri
        run: cargo build --locked -p umux-storestation -p umux
      - name: Test daemon, CLI and shared engines
        working-directory: src-tauri
        run: cargo test --locked -p umux-storestation -p umux -p store_core -p session_core
