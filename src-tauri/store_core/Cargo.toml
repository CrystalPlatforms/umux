[package]
name = "store_core"
version = "1.5.1"
description = "umux shared store library: workspace/settings model, persistence, config paths"
edition = "2021"
rust-version = "1.77.2"

# StoreCore is deliberately Tauri-free (#58): both the Tauri app and the
# upcoming `umux` CLI write the same files through this one implementation,
# so neither can corrupt the other's store. No I/O beyond plain std::fs.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# preserve_order: the cmux import iterates cmux.json `actions` in DOCUMENT
# order — the TS importer's Object.values contract, which the action ids and
# the merged plan order depend on (#63 parity).
serde_json = { version = "1.0", features = ["preserve_order"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"
