[package]
name = "session_core"
version = "1.7.6"
edition = "2021"
rust-version = "1.77.2"
description = "The shared umux session engine: PTY/session lifecycle linked by the desktop app in-process and by the umux-storestation daemon (v1.7.0 phase 2, issue #84)"

[dependencies]
portable-pty = "0.8"
# Client-generated session ids are UUIDv4 (the protocol's idempotent-create
# groundwork); the app's daemon-client driver mints them here.
uuid = { version = "1", features = ["v4"] }

# #88 (v1.7.0 phase 6, Windows): the kill-on-close Job object — owned shells
# die with their owner process even on a hard kill. Versions match the app
# crate's tree so the windows-sys types unify.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # The job-object module's CreateJobObjectW takes SECURITY_ATTRIBUTES, so
  # this feature is required even in ISOLATED builds (`cargo test -p
  # session_core`) — whole-workspace builds used to paper over it through
  # feature unification with the app crate.
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # #117 follow-up: recover the typed word (claude/codex/…) from the
  # foreground process's command line — the Windows image name is always
  # "node" for a `claude` script, so known-CLI presence never matched and
  # waiting pings never fired. NtQueryInformationProcess (Wdk), the PBI
  # struct (Kernel), ReadProcessMemory (Debug).
  "Win32_System_Diagnostics_Debug",
  # #117 follow-up: the Windows "who owns the terminal" answer comes from a
  # Toolhelp32 process snapshot (pid→parent map), replacing the hard None.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Wdk_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
