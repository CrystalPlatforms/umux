[package]
name = "app"
version = "1.6.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Cargo workspace (#58): the app package is the root member; StoreCore lives
# beside it so both build in one workspace. The Tauri CLI keeps invoking cargo
# from this directory as before.
[workspace]
members = [".", "store_core", "cli"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.8"
tauri-plugin-aptabase = "1.0.0"
store_core = { path = "store_core" }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2.3.3"
# Issue #72: clicking a listening port opens http://localhost:{port} in the
# system browser (the opener plugin's open-url path).
tauri-plugin-opener = "2"
reqwest = "0.13.3"
# PTY output bytes go over the IPC bridge as base64, not a JSON number array —
# a 4 KB chunk is ~5.4 KB of base64 vs ~15 KB of "[12,34,...]" text, and the
# renderer decodes it far cheaper (perf audit 2026-09-05, Windows jank).
base64 = "0.22"

# Native foreground-process name lookup (perf audit 2026-09-05): the previous
# implementation spawned `tasklist.exe` — 100–500 ms per call, made for every
# local panel every ~2 s on the UI thread. OpenProcess + QueryFullProcessImageNameW
# answers in microseconds with the same image name.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
# HITL 2026-09-10: WebView2's browser accelerator keys (Ctrl+Shift+C opened
# DevTools before the terminal could copy) are disabled through
# ICoreWebView2Settings6 at setup. Versions match tauri's own tree so the
# COM interface types unify.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com"] }

# The user's real login shell via getpwuid (macOS report 2026-09-07): a
# GUI-launched app has no $SHELL in its environment, so the /bin/sh fallback
# spawned sh instead of the user's zsh/bash — none of their shell config
# loaded (no prompt integration, no aliases). Already in the tree
# transitively; this makes it directly usable on unix targets.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
