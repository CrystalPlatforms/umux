[package]
name = "app"
version = "1.5.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Cargo workspace (#58): the app package is the root member; StoreCore lives
# beside it so both build in one workspace. The Tauri CLI keeps invoking cargo
# from this directory as before.
[workspace]
members = [".", "store_core", "cli"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.8"
tauri-plugin-aptabase = "1.0.0"
store_core = { path = "store_core" }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2.3.3"
# Issue #72: clicking a listening port opens http://localhost:{port} in the
# system browser (the opener plugin's open-url path).
tauri-plugin-opener = "2"
reqwest = "0.13.3"

[dev-dependencies]
tempfile = "3"
