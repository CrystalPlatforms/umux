[package]
name = "umux-storestation"
version = "1.6.0"
description = "umux Storestation — headless daemon: per-user local socket, protocol v1 (storestation.status/storestation.shutdown)"
edition = "2021"
rust-version = "1.77.2"

# The daemon crate is Tauri-free like store_core (#83, v1.7.0 phase 1): the
# same library (protocol + client) is linked by the `umux` CLI, and the
# `umux-storestation` binary serves the socket. Socket location reuses
# store_core::paths (UMUX_CONFIG_DIR isolates store + socket + pid together).

[lib]
name = "umux_storestation"

[dependencies]
store_core = { path = "../store_core" }
# #84 (v1.7.0 phase 2): the daemon serves real sessions through the shared
# session engine — the same PtyService the desktop app links in-process.
session_core = { path = "../session_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# session.write carries its bytes base64-encoded inside the JSON control
# envelope (binary-safe over the text protocol, same wire economy as the
# app's pty_output bridge).
base64 = "0.22"
# Ctrl+C handling that works on all three platforms (the handler runs on a
# normal thread, so the graceful socket/pid cleanup is safe there).
ctrlc = "3"

# Windows transport: a named pipe instead of a UDS (std has no named-pipe
# support). Tokio is only pulled on Windows targets; macOS/Linux compile
# pure-std code paths. windows-sys (#89) also hides the console window for
# `run --hidden` (the autostart launch) — versions match the app crate.
[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "rt", "time"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
] }

# #88 (v1.7.0 phase 6): the crash-recovery sweep signals recorded shell
# process groups (kill/getpgid) — the same dep the app crate already carries.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
