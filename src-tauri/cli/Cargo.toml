[package]
name = "umux"
version = "1.6.0"
description = "umux command-line interface: offline workspace/config CRUD against the shared store"
edition = "2021"
rust-version = "1.77.2"

# The CLI is store_core-only (#60): it knows the store library's API, never
# the file format, so a CLI write and an app write are the same code path.

[dependencies]
store_core = { path = "../store_core" }
# Core additions (#83): `umux status` and (later) the live commands talk to
# the daemon through the same client library the desktop app will use.
umux-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
# The import command prints its plan as JSON (#63).
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
store_core = { path = "../store_core" }
