<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umux notification</title>
    <!--
      Notification banner (#118): a static, tiny page the umux-owned Windows
      banner window loads ONCE at boot (hidden) and the Rust notifier shows
      per notification. The native toast's click is dead on the Insider
      machine (issue #118), so this banner replaces it: clicking sends the
      EXACT notification payload out as `notification_activated` and the main
      window navigates + focuses. The window is focusable(false) — appearing
      never steals focus — while a click still lands (WS_EX_NOACTIVATE).
      Colors match the splashscreen's palette (bg #111317, accent green
      #167c51). Spring press feedback is the standing rule (#101).
    -->
    <style>
      /* The height chain MUST be complete (html -> body -> .banner): a
         missing level collapses the banner to its content height and the
         window paints a black remainder (HITL 2026-10-23). No border-radius:
         WebView2's transparent background proved unreliable on this machine,
         and radius over an opaque layer shows black corner notches — a full
         solid rectangle (Steam/Discord-toast style) is opacity-independent. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* Same dark as the banner: during the slide-in the strip left of
         the incoming banner reads as the window itself, not a black hole. */
        background: #111317;
        overflow: hidden;
        user-select: none;
      }
      .banner {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        background: #111317;
        border: 1px solid #2a2e35;
        opacity: 1;
        transform: scale(1);
        transition:
          opacity 250ms ease,
          transform 120ms ease;
        font-family: 'Segoe UI', system-ui, sans-serif;
        cursor: default;
      }
      /* Slide-in from the right (HITL 2026-10-23): the banner enters at
         translateX(100%) — fully past the right edge — and settles left.
         The class is (re)applied by the glue right AFTER the window shows,
         so the sweep is never missed while the window is still hidden.
         ease-out: fast entry, gentle settle. */
      .banner.is-entering {
        animation: banner-slide-in 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes banner-slide-in {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }
      /* The controller's fade-out phase (onFadeOut hook): text stays, the
         whole banner dissolves; the window is hidden when the fade ends. */
      .banner.is-fading {
        opacity: 0;
      }
      /* Spring press feedback (#101) — same scale family as the app. */
      .banner:active {
        transform: scale(0.96);
      }
      /* No plate behind the logo (HITL 2026-10-23): the umux glyph sits
         directly on the banner. */
      .banner-icon {
        flex: none;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .banner-icon img {
        width: 24px;
        height: 24px;
      }
      .banner-text {
        min-width: 0;
      }
      .banner-summary {
        font-size: 13px;
        font-weight: 600;
        color: #e8eaed;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .banner-body {
        margin-top: 2px;
        font-size: 12px;
        color: #9aa0a6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="banner" class="banner" role="button" aria-label="Open notification target">
      <div class="banner-icon"><img src="/umux-icon.png" alt="" /></div>
      <div class="banner-text">
        <div id="banner-summary" class="banner-summary"></div>
        <div id="banner-body" class="banner-body"></div>
      </div>
    </div>
    <script type="module" src="/src/bannerEntry.ts"></script>
  </body>
</html>
